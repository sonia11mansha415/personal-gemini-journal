    <script>
      // Gracefully prevent unhandled rejections from development Vite HMR WebSocket drops in preview proxies
      window.addEventListener('unhandledrejection', function (event) {
        var reason = event && event.reason;
        var msg = (reason && (reason.message || String(reason))) || '';
        if (typeof msg === 'string' && (msg.includes('WebSocket closed without opened') || msg.includes('failed to connect to websocket'))) {
          event.preventDefault();
        }
      });
    </script>

  </body>
